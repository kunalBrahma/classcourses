# Class Course: nginx on the VPS (HTTPS added by certbot).
#   sudo cp deploy/nginx/classcourse.conf /etc/nginx/sites-available/classcourse
#   sudo ln -s /etc/nginx/sites-available/classcourse /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d myclasscourse.in -d www.myclasscourse.in -d admin.myclasscourse.in -d api.myclasscourse.in
# Ports must match docker-compose.prod.yml. nginx is the one proxy hop, so the
# API's TRUST_PROXY=1.

# Student site
server {
    listen 80;
    server_name myclasscourse.in;

    location / {
        proxy_pass         http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# www → bare domain
server {
    listen 80;
    server_name www.myclasscourse.in;
    return 301 https://myclasscourse.in$request_uri;
}

# Admin panel
server {
    listen 80;
    server_name admin.myclasscourse.in;

    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass         http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# API
server {
    listen 80;
    server_name api.myclasscourse.in;

    # Bulk question imports are up to 3 MB. Files go straight to R2 (presigned).
    client_max_body_size 5m;

    location / {
        proxy_pass         http://127.0.0.1:4150;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
