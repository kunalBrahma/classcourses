# Class Course: build images in GitHub Actions, push them to GHCR, and the VPS
# pulls and restarts them (deploy/deploy.sh). Nothing is built on the VPS: it's
# shared, and a `next build` there can starve every other app of memory.
#
# Order matters: the API ships first, because the student site's `next build`
# prerenders from the live API (https://api.myclasscourse.in). If the API is
# unreachable that build fails, and the running site is left untouched.
#
# Repo secrets (Settings → Secrets and variables → Actions):
#   VPS_HOST     91.108.111.237
#   VPS_USER     kunal
#   VPS_SSH_KEY  private key whose public half is in ~kunal/.ssh/authorized_keys
#   INTERNAL_API_KEY  same value as in the server's root .env (lets the site's
#                build skip the API's per-IP limit)
#
# One-time on the VPS (DEPLOY.md): /var/www/classcourse is a clone of this repo
# with a root .env and backend/.env. This workflow never creates secrets.

name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_BASE: ghcr.io/kunalbrahma/classcourse
  API_URL: https://api.myclasscourse.in
  SITE_URL: https://myclasscourse.in

jobs:
  build-api:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: backend, target: production }
          # The build stage keeps the Prisma CLI and ts-node: migrations,
          # seed and create-admin run from this image.
          - { name: backend-tools, target: build }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-${{ matrix.name }}:latest
            ${{ env.IMAGE_BASE }}-${{ matrix.name }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    needs: build-api
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /var/www/classcourse
            git fetch --quiet origin main && git reset --hard --quiet ${{ github.sha }}
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            deploy/deploy.sh sha-${{ github.sha }} backend

  build-web:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: deploy-api
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        name: [frontend, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.name }}
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-${{ matrix.name }}:latest
            ${{ env.IMAGE_BASE }}-${{ matrix.name }}:sha-${{ github.sha }}
          # API_INTERNAL_URL is only used by the student site's build.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.API_URL }}
            NEXT_PUBLIC_SITE_URL=${{ env.SITE_URL }}
            API_INTERNAL_URL=${{ env.API_URL }}
          secrets: |
            internal_api_key=${{ secrets.INTERNAL_API_KEY }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy-web:
    name: Deploy site + admin
    runs-on: ubuntu-latest
    needs: build-web
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /var/www/classcourse
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            deploy/deploy.sh sha-${{ github.sha }} frontend admin
            curl -fsS -o /dev/null -w "site %{http_code}\n" https://myclasscourse.in/
